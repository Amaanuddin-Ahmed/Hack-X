<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brain MRI Analysis</title>
<style>body{margin:0;background:#f6f8fb;color:#172033;font:16px system-ui,sans-serif}main{max-width:860px;margin:48px auto;padding:0 20px}.card{background:#fff;border:1px solid #dde3ec;border-radius:16px;padding:24px}.warning{background:#fff5df;border-left:4px solid #dc8a00;padding:12px}.drop{margin-top:20px;border:2px dashed #8ba7d5;border-radius:12px;padding:24px;text-align:center}button{margin-top:14px;padding:11px 16px;border:0;border-radius:8px;background:#245bc5;color:#fff;font-weight:700}button:disabled{opacity:.5}img{display:none;max-width:100%;max-height:340px;margin:18px auto 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#101827;color:#e8eef9;padding:16px;border-radius:10px;min-height:100px}.muted{color:#58657a}</style></head>
<body><main><div class="card"><h1>Brain MRI Analysis</h1><p class="warning"><strong>Research only.</strong> This classifier is not a medical device and must not guide diagnosis or treatment.</p><p class="muted">Upload a de-identified 2D brain MRI image. The model downloads once on first use.</p><div class="drop"><input id="file" type="file" accept="image/jpeg,image/png,image/webp"><br><button id="analyze" disabled>Analyze MRI</button><div id="status"></div><img id="preview" alt="Selected MRI preview"></div><h3>Structured result</h3><pre id="output">Waiting for an MRI image…</pre></div></main>
<script>const input=document.querySelector('#file'),button=document.querySelector('#analyze'),out=document.querySelector('#output'),status=document.querySelector('#status'),preview=document.querySelector('#preview');input.onchange=()=>{const f=input.files[0];button.disabled=!f;if(f){preview.src=URL.createObjectURL(f);preview.style.display='block';out.textContent='Ready to analyze.';status.textContent='';}};button.onclick=async()=>{const f=input.files[0];if(!f)return;button.disabled=true;status.textContent='Loading model / analyzing…';out.textContent='';const form=new FormData();form.append('file',f);try{const res=await fetch('/api/v1/medical/mri/analyze',{method:'POST',body:form}),data=await res.json();if(!res.ok)throw Error(data.detail||'Analysis failed');out.textContent=JSON.stringify(data,null,2);status.textContent='Analysis completed.';}catch(e){out.textContent=e.message;status.textContent='Analysis failed.';}finally{button.disabled=false;}};</script></body></html>
